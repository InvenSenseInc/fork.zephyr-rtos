CONFIG_SENSOR=y
CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=n

# Floating point format support
# Selecting this increases stack size requirements slightly, but increases code size significantly.
CONFIG_CBPRINTF_FP_SUPPORT=y

# nrf52dk/nrf52832 specific
CONFIG_USE_SEGGER_RTT=n

# Trigger mode: sample is using interrupt triggering
CONFIG_ICM42X70_TRIGGER_OWN_THREAD=y

CONFIG_FPU=y
CONFIG_FP_HARDABI=y
CONFIG_ICM42X70_THREAD_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_CODE_DATA_RELOCATION=y
#CONFIG_XIP=y
# Need this when storage is on MX25R64
CONFIG_FLASH=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_HAVE_CUSTOM_LINKER_SCRIPT=y
CONFIG_CUSTOM_LINKER_SCRIPT="app.ld"

CONFIG_NORDIC_QSPI_NOR_XIP=y
#CONFIG_XIP_SPLIT_IMAGE=y
#CONFIG_BOOTLOADER_MCUBOOT=y
#CONFIG_FLASH_INIT_PRIORITY=40

#CONFIG_NRF_ENABLE_CACHE=y

